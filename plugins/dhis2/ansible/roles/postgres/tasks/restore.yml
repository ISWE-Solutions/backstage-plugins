---
# Restore an existing DHIS2 database backup into the freshly created DB.
#
# Works in both modes:
#   * Local install (dhis2_db_remote=false): file operations + psql/pg_restore
#     run inside the LXC as the `postgres` unix user; community.postgresql
#     modules connect via local socket.
#   * Shared host  (dhis2_db_remote=true):  file operations + psql/pg_restore
#     run on the orchestrator (delegate_to: 127.0.0.1) against the configured
#     dhis2_db_host:dhis2_db_port using dhis2_db_admin_user/password.
#
# Expects fact `dhis2_restore` (dict) with at least:
#   kind:          upload|url|s3|instance|vzdump|local
#   dump_format:   plain|custom|directory   (optional; auto-detected for
#                  upload/url/instance)
#   local_staging_path: absolute path where the dump should land for
#                       processing. For 'upload'/'instance'/'vzdump' the
#                       orchestrator (create-instance.sh) pre-populates
#                       this — in remote mode it points to the file on the
#                       orchestrator; in local mode the stage_restore role
#                       has copied it into the LXC.
#
# For 'url'   the role downloads in-place on the work host.
# For 's3'    the role pulls the object using amazon.aws.s3_object.
# For 'local' the role copies from `dhis2_restore.path` on the work host.

# ---------------------------------------------------------------------------
# Work-host selection: where do file operations and psql run?
# ---------------------------------------------------------------------------

- name: Restore | compute work host (orchestrator in remote DB mode, else this host)
  ansible.builtin.set_fact:
    _dhis2_restore_workhost: >-
      {{ '127.0.0.1' if (dhis2_db_remote | default(false) | bool)
         else inventory_hostname }}
    _dhis2_restore_remote: "{{ dhis2_db_remote | default(false) | bool }}"

- name: Restore | ensure PostgreSQL client tools are installed on the work host
  ansible.builtin.apt:
    name:
      - postgresql-client
      - gzip
      - zstd
    state: present
    update_cache: false
  delegate_to: "{{ _dhis2_restore_workhost }}"
  become: "{{ not _dhis2_restore_remote }}"
  when: not _dhis2_restore_remote
  # When remote, postgresql-client + gzip/zstd are expected to be present on
  # the orchestrator (installed by scripts/install.sh). We don't apt-install
  # there because the orchestrator host may not be Debian/Ubuntu-based and
  # we shouldn't elevate privileges on it from a delegated task.

- name: Restore | ensure staging directory exists on the work host
  ansible.builtin.file:
    path: "{{ dhis2_restore.local_staging_path | default('/var/lib/dhis2-restore/dump.bin') | dirname }}"
    state: directory
    owner: "{{ 'postgres' if not _dhis2_restore_remote else omit }}"
    group: "{{ 'postgres' if not _dhis2_restore_remote else omit }}"
    mode: "0750"
  delegate_to: "{{ _dhis2_restore_workhost }}"
  become: "{{ not _dhis2_restore_remote }}"

- name: Restore | set staged dump path (orchestrator-supplied)
  ansible.builtin.set_fact:
    _dhis2_restore_staged: "{{ dhis2_restore.local_staging_path | default('/var/lib/dhis2-restore/dump.bin') }}"

# ---------------------------------------------------------------------------
# Source acquisition (runs on the work host)
# ---------------------------------------------------------------------------

- name: Restore | download dump from URL
  ansible.builtin.get_url:
    url: "{{ dhis2_restore.url }}"
    dest: "{{ _dhis2_restore_staged }}"
    headers: "{{ dhis2_restore.headers | default({}) }}"
    mode: "0640"
    owner: "{{ 'postgres' if not _dhis2_restore_remote else omit }}"
    group: "{{ 'postgres' if not _dhis2_restore_remote else omit }}"
    force: true
  delegate_to: "{{ _dhis2_restore_workhost }}"
  become: "{{ not _dhis2_restore_remote }}"
  when: dhis2_restore.kind == 'url'

- name: Restore | fetch dump from S3
  amazon.aws.s3_object:
    bucket: "{{ dhis2_restore.bucket }}"
    object: "{{ dhis2_restore.key }}"
    dest: "{{ _dhis2_restore_staged }}"
    mode: get
    region: "{{ dhis2_restore.region | default(omit) }}"
    endpoint_url: "{{ dhis2_restore.endpoint | default(omit) }}"
    aws_access_key: "{{ dhis2_restore.access_key | default(omit) }}"
    aws_secret_key: "{{ dhis2_restore.secret_key | default(omit) }}"
  delegate_to: "{{ _dhis2_restore_workhost }}"
  become: "{{ not _dhis2_restore_remote }}"
  when: dhis2_restore.kind == 's3'
  no_log: true

- name: Restore | copy dump from a local path on the work host
  ansible.builtin.copy:
    src: "{{ dhis2_restore.path }}"
    dest: "{{ _dhis2_restore_staged }}"
    remote_src: true
    owner: "{{ 'postgres' if not _dhis2_restore_remote else omit }}"
    group: "{{ 'postgres' if not _dhis2_restore_remote else omit }}"
    mode: "0640"
  delegate_to: "{{ _dhis2_restore_workhost }}"
  become: "{{ not _dhis2_restore_remote }}"
  when: dhis2_restore.kind == 'local'

- name: Restore | pg_dump from source DHIS2 instance (runs on work host)
  ansible.builtin.command:
    cmd: >-
      pg_dump
      -h {{ dhis2_restore.source_host }}
      -p {{ dhis2_restore.source_port | default(5432) }}
      -U {{ dhis2_restore.source_user }}
      -d {{ dhis2_restore.source_db }}
      -Fc --no-owner --no-privileges
      -f {{ _dhis2_restore_staged }}
  environment:
    PGPASSWORD: "{{ dhis2_restore.source_password | default('') }}"
  delegate_to: "{{ _dhis2_restore_workhost }}"
  become: "{{ not _dhis2_restore_remote }}"
  become_user: "{{ omit if _dhis2_restore_remote else 'postgres' }}"
  when: dhis2_restore.kind == 'instance'
  no_log: true

# For kinds 'upload' and 'vzdump' the orchestrator has placed the dump at
# `local_staging_path` on the work host (the LXC in local mode via
# stage_restore, the orchestrator filesystem in remote mode). For
# 'instance' the pg_dump task above just created it. Just verify it exists.

- name: Restore | verify staged dump exists
  ansible.builtin.stat:
    path: "{{ _dhis2_restore_staged }}"
  register: _dhis2_restore_stat
  delegate_to: "{{ _dhis2_restore_workhost }}"
  become: "{{ not _dhis2_restore_remote }}"
  when: dhis2_restore.kind in ['upload', 'vzdump', 'instance']

- name: Restore | fail if staged dump missing
  ansible.builtin.fail:
    msg: "Expected staged dump at {{ _dhis2_restore_staged }} on {{ _dhis2_restore_workhost }} but it was not found."
  when:
    - dhis2_restore.kind in ['upload', 'vzdump', 'instance']
    - not _dhis2_restore_stat.stat.exists

# ---------------------------------------------------------------------------
# Decompress (.gz / .zst) if applicable — runs on the work host.
# Detection is by content (gzip -t / zstd -t) rather than filename suffix,
# because the orchestrator stages downloads under a generic name like
# dump.bin regardless of the original URL extension.
# ---------------------------------------------------------------------------

- name: Restore | test whether staged dump is gzip-compressed
  ansible.builtin.command:
    cmd: "gzip -t {{ _dhis2_restore_staged }}"
  register: _dhis2_gz_test
  changed_when: false
  failed_when: false
  delegate_to: "{{ _dhis2_restore_workhost }}"
  become: "{{ not _dhis2_restore_remote }}"

- name: Restore | test whether staged dump is zstd-compressed
  ansible.builtin.command:
    cmd: "zstd -t -q {{ _dhis2_restore_staged }}"
  register: _dhis2_zst_test
  changed_when: false
  failed_when: false
  when: _dhis2_gz_test.rc != 0
  delegate_to: "{{ _dhis2_restore_workhost }}"
  become: "{{ not _dhis2_restore_remote }}"

- name: Restore | decompress gzip dump in place
  ansible.builtin.shell:
    cmd: >-
      set -euo pipefail;
      gunzip -c {{ _dhis2_restore_staged | quote }} > {{ _dhis2_restore_staged | quote }}.dec
      && mv {{ _dhis2_restore_staged | quote }}.dec {{ _dhis2_restore_staged | quote }}
    executable: /bin/bash
  delegate_to: "{{ _dhis2_restore_workhost }}"
  become: "{{ not _dhis2_restore_remote }}"
  when: _dhis2_gz_test.rc == 0
  changed_when: true

- name: Restore | decompress zstd dump in place
  ansible.builtin.shell:
    cmd: >-
      set -euo pipefail;
      zstd -d -c {{ _dhis2_restore_staged | quote }} > {{ _dhis2_restore_staged | quote }}.dec
      && mv {{ _dhis2_restore_staged | quote }}.dec {{ _dhis2_restore_staged | quote }}
    executable: /bin/bash
  delegate_to: "{{ _dhis2_restore_workhost }}"
  become: "{{ not _dhis2_restore_remote }}"
  when:
    - _dhis2_gz_test.rc != 0
    - _dhis2_zst_test.rc | default(1) == 0
  changed_when: true

# ---------------------------------------------------------------------------
# Format auto-detection (runs on the work host)
# ---------------------------------------------------------------------------

- name: Restore | sniff dump format if not provided
  when: dhis2_restore.dump_format is not defined
  block:
    - name: Restore | read first bytes of dump
      ansible.builtin.command:
        cmd: "head -c 5 {{ _dhis2_restore_staged }}"
      register: _dhis2_dump_head
      changed_when: false
      delegate_to: "{{ _dhis2_restore_workhost }}"
      become: "{{ not _dhis2_restore_remote }}"

    - name: Restore | set dump_format based on magic bytes
      ansible.builtin.set_fact:
        _dhis2_dump_format: "{{ 'custom' if (_dhis2_dump_head.stdout.startswith('PGDMP')) else 'plain' }}"

- name: Restore | use provided dump_format
  ansible.builtin.set_fact:
    _dhis2_dump_format: "{{ dhis2_restore.dump_format }}"
  when: dhis2_restore.dump_format is defined

# ---------------------------------------------------------------------------
# (Re)create the target database to ensure a clean slate
# ---------------------------------------------------------------------------

- name: Restore | terminate existing connections to target DB
  community.postgresql.postgresql_query:
    db: postgres
    query: >
      SELECT pg_terminate_backend(pid)
      FROM pg_stat_activity
      WHERE datname = %s AND pid <> pg_backend_pid()
    positional_args:
      - "{{ dhis2_db_name }}"
    login_host: "{{ dhis2_db_host if _dhis2_restore_remote else omit }}"
    login_port: "{{ dhis2_db_port if _dhis2_restore_remote else omit }}"
    login_user: "{{ dhis2_db_admin_user if _dhis2_restore_remote else omit }}"
    login_password: "{{ dhis2_db_admin_password if _dhis2_restore_remote else omit }}"
  delegate_to: "{{ _dhis2_restore_workhost }}"
  become: "{{ not _dhis2_restore_remote }}"
  become_user: "{{ omit if _dhis2_restore_remote else 'postgres' }}"

- name: Restore | drop existing database
  community.postgresql.postgresql_db:
    name: "{{ dhis2_db_name }}"
    state: absent
    login_host: "{{ dhis2_db_host if _dhis2_restore_remote else omit }}"
    login_port: "{{ dhis2_db_port if _dhis2_restore_remote else omit }}"
    login_user: "{{ dhis2_db_admin_user if _dhis2_restore_remote else omit }}"
    login_password: "{{ dhis2_db_admin_password if _dhis2_restore_remote else omit }}"
  delegate_to: "{{ _dhis2_restore_workhost }}"
  become: "{{ not _dhis2_restore_remote }}"
  become_user: "{{ omit if _dhis2_restore_remote else 'postgres' }}"

- name: Restore | recreate empty database
  community.postgresql.postgresql_db:
    name: "{{ dhis2_db_name }}"
    owner: "{{ dhis2_db_user }}"
    encoding: UTF-8
    lc_collate: en_US.UTF-8
    lc_ctype: en_US.UTF-8
    template: template0
    state: present
    login_host: "{{ dhis2_db_host if _dhis2_restore_remote else omit }}"
    login_port: "{{ dhis2_db_port if _dhis2_restore_remote else omit }}"
    login_user: "{{ dhis2_db_admin_user if _dhis2_restore_remote else omit }}"
    login_password: "{{ dhis2_db_admin_password if _dhis2_restore_remote else omit }}"
  delegate_to: "{{ _dhis2_restore_workhost }}"
  become: "{{ not _dhis2_restore_remote }}"
  become_user: "{{ omit if _dhis2_restore_remote else 'postgres' }}"

- name: Restore | reinstall required PostgreSQL extensions
  community.postgresql.postgresql_ext:
    name: "{{ item }}"
    db: "{{ dhis2_db_name }}"
    state: present
    login_host: "{{ dhis2_db_host if _dhis2_restore_remote else omit }}"
    login_port: "{{ dhis2_db_port if _dhis2_restore_remote else omit }}"
    login_user: "{{ dhis2_db_admin_user if _dhis2_restore_remote else omit }}"
    login_password: "{{ dhis2_db_admin_password if _dhis2_restore_remote else omit }}"
  loop: "{{ postgresql_extensions }}"
  delegate_to: "{{ _dhis2_restore_workhost }}"
  become: "{{ not _dhis2_restore_remote }}"
  become_user: "{{ omit if _dhis2_restore_remote else 'postgres' }}"

# ---------------------------------------------------------------------------
# Restore the dump (runs on the work host; in remote mode uses PG* env vars
# so the same psql/pg_restore binaries talk to the configured DB host).
# ---------------------------------------------------------------------------

- name: Restore | apply plain SQL dump with psql
  # -q suppresses per-statement output (CREATE TABLE / COPY n / ALTER TABLE …).
  # Without it a typical DHIS2 dump emits tens of thousands of lines that, under
  # ansible -v, are buffered into the task result and have been observed to
  # back-pressure the backend's stdout pipe long enough to stall ansible-playbook.
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      psql -q --single-transaction --set ON_ERROR_STOP=on
      -d {{ dhis2_db_name }} -f {{ _dhis2_restore_staged }}
      > {{ _dhis2_restore_staged }}.psql.log 2>&1
    executable: /bin/bash
  environment: "{{ {'PGHOST': dhis2_db_host, 'PGPORT': dhis2_db_port | string, 'PGUSER': dhis2_db_admin_user, 'PGPASSWORD': dhis2_db_admin_password} if _dhis2_restore_remote else {} }}"
  delegate_to: "{{ _dhis2_restore_workhost }}"
  become: "{{ not _dhis2_restore_remote }}"
  become_user: "{{ omit if _dhis2_restore_remote else 'postgres' }}"
  when: _dhis2_dump_format == 'plain'
  no_log: "{{ _dhis2_restore_remote and not (dhis2_debug | default(false) | bool) }}"

- name: Restore | apply custom-format dump with pg_restore
  ansible.builtin.command:
    cmd: >
      pg_restore --no-owner --role={{ dhis2_db_user }}
      --dbname={{ dhis2_db_name }} --jobs=4
      {{ _dhis2_restore_staged }}
  environment: "{{ {'PGHOST': dhis2_db_host, 'PGPORT': dhis2_db_port | string, 'PGUSER': dhis2_db_admin_user, 'PGPASSWORD': dhis2_db_admin_password} if _dhis2_restore_remote else {} }}"
  delegate_to: "{{ _dhis2_restore_workhost }}"
  become: "{{ not _dhis2_restore_remote }}"
  become_user: "{{ omit if _dhis2_restore_remote else 'postgres' }}"
  when: _dhis2_dump_format == 'custom'
  register: _dhis2_pgrestore_custom
  failed_when:
    - _dhis2_pgrestore_custom.rc != 0
    - "'errors ignored on restore' not in _dhis2_pgrestore_custom.stderr | default('')"
  no_log: "{{ _dhis2_restore_remote and not (dhis2_debug | default(false) | bool) }}"

- name: Restore | apply directory-format dump with pg_restore
  ansible.builtin.command:
    cmd: >
      pg_restore --no-owner --role={{ dhis2_db_user }}
      --dbname={{ dhis2_db_name }} --jobs=4 --format=directory
      {{ _dhis2_restore_staged }}
  environment: "{{ {'PGHOST': dhis2_db_host, 'PGPORT': dhis2_db_port | string, 'PGUSER': dhis2_db_admin_user, 'PGPASSWORD': dhis2_db_admin_password} if _dhis2_restore_remote else {} }}"
  delegate_to: "{{ _dhis2_restore_workhost }}"
  become: "{{ not _dhis2_restore_remote }}"
  become_user: "{{ omit if _dhis2_restore_remote else 'postgres' }}"
  when: _dhis2_dump_format == 'directory'
  register: _dhis2_pgrestore_dir
  failed_when:
    - _dhis2_pgrestore_dir.rc != 0
    - "'errors ignored on restore' not in _dhis2_pgrestore_dir.stderr | default('')"
  no_log: "{{ _dhis2_restore_remote and not (dhis2_debug | default(false) | bool) }}"

# ---------------------------------------------------------------------------
# Post-restore housekeeping
# ---------------------------------------------------------------------------

- name: Restore | reassign ownership to DHIS2 user
  community.postgresql.postgresql_query:
    db: "{{ dhis2_db_name }}"
    query: "SET lock_timeout = '30s'; SET statement_timeout = '60s'; REASSIGN OWNED BY {{ dhis2_db_admin_user }} TO {{ dhis2_db_user }}"
    login_host: "{{ dhis2_db_host if _dhis2_restore_remote else omit }}"
    login_port: "{{ dhis2_db_port if _dhis2_restore_remote else omit }}"
    login_user: "{{ dhis2_db_admin_user if _dhis2_restore_remote else omit }}"
    login_password: "{{ dhis2_db_admin_password if _dhis2_restore_remote else omit }}"
  delegate_to: "{{ _dhis2_restore_workhost }}"
  become: "{{ not _dhis2_restore_remote }}"
  become_user: "{{ omit if _dhis2_restore_remote else 'postgres' }}"
  # Only meaningful in remote/admin-mode where the admin role temporarily
  # owned restored objects. In local mode the dump was loaded as the target
  # role already, and REASSIGN OWNED BY postgres can never succeed (system
  # objects) — it would just hang on locks against post-COPY autovacuum.
  when: _dhis2_restore_remote and dhis2_db_admin_user != dhis2_db_user
  ignore_errors: true

- name: Restore | re-grant privileges to DHIS2 user
  community.postgresql.postgresql_privs:
    db: "{{ dhis2_db_name }}"
    roles: "{{ dhis2_db_user }}"
    type: database
    privs: ALL
    state: present
    login_host: "{{ dhis2_db_host if _dhis2_restore_remote else omit }}"
    login_port: "{{ dhis2_db_port if _dhis2_restore_remote else omit }}"
    login_user: "{{ dhis2_db_admin_user if _dhis2_restore_remote else omit }}"
    login_password: "{{ dhis2_db_admin_password if _dhis2_restore_remote else omit }}"
  delegate_to: "{{ _dhis2_restore_workhost }}"
  become: "{{ not _dhis2_restore_remote }}"
  become_user: "{{ omit if _dhis2_restore_remote else 'postgres' }}"

# After a local-mode restore the dump was loaded as the postgres superuser, so
# all restored objects (tables, sequences, views, including flyway_schema_history)
# are owned by postgres. The DHIS2 runtime role only has database-level GRANTs
# and would hit "permission denied for table flyway_schema_history" on boot.
# Reassign object ownership in the public schema and grant table/sequence
# privileges so the app role can read/write everything that was restored.
- name: Restore | transfer object ownership to DHIS2 user (public schema)
  community.postgresql.postgresql_query:
    db: "{{ dhis2_db_name }}"
    query: |
      SET lock_timeout = '30s';
      SET statement_timeout = '120s';
      DO $$
      DECLARE r record;
      BEGIN
        FOR r IN
          SELECT n.nspname, c.relname, c.relkind
          FROM pg_class c
          JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE n.nspname = 'public'
            AND c.relkind IN ('r','p','S','v','m','f')
        LOOP
          EXECUTE format('ALTER %s %I.%I OWNER TO %I',
            CASE r.relkind
              WHEN 'S' THEN 'SEQUENCE'
              WHEN 'v' THEN 'VIEW'
              WHEN 'm' THEN 'MATERIALIZED VIEW'
              WHEN 'f' THEN 'FOREIGN TABLE'
              ELSE 'TABLE'
            END,
            r.nspname, r.relname, '{{ dhis2_db_user }}');
        END LOOP;
        EXECUTE format('ALTER SCHEMA public OWNER TO %I', '{{ dhis2_db_user }}');
      END $$;
    login_host: "{{ dhis2_db_host if _dhis2_restore_remote else omit }}"
    login_port: "{{ dhis2_db_port if _dhis2_restore_remote else omit }}"
    login_user: "{{ dhis2_db_admin_user if _dhis2_restore_remote else omit }}"
    login_password: "{{ dhis2_db_admin_password if _dhis2_restore_remote else omit }}"
  delegate_to: "{{ _dhis2_restore_workhost }}"
  become: "{{ not _dhis2_restore_remote }}"
  become_user: "{{ omit if _dhis2_restore_remote else 'postgres' }}"
  when: dhis2_db_admin_user != dhis2_db_user
  register: _dhis2_reassign_owner
  failed_when: false

- name: Restore | grant schema and object privileges to DHIS2 user
  community.postgresql.postgresql_query:
    db: "{{ dhis2_db_name }}"
    query: |
      GRANT USAGE, CREATE ON SCHEMA public TO {{ dhis2_db_user }};
      GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO {{ dhis2_db_user }};
      GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO {{ dhis2_db_user }};
      GRANT ALL PRIVILEGES ON ALL FUNCTIONS IN SCHEMA public TO {{ dhis2_db_user }};
    login_host: "{{ dhis2_db_host if _dhis2_restore_remote else omit }}"
    login_port: "{{ dhis2_db_port if _dhis2_restore_remote else omit }}"
    login_user: "{{ dhis2_db_admin_user if _dhis2_restore_remote else omit }}"
    login_password: "{{ dhis2_db_admin_password if _dhis2_restore_remote else omit }}"
  delegate_to: "{{ _dhis2_restore_workhost }}"
  become: "{{ not _dhis2_restore_remote }}"
  become_user: "{{ omit if _dhis2_restore_remote else 'postgres' }}"
  when: dhis2_db_admin_user != dhis2_db_user

- name: Restore | ANALYZE database (best-effort, local DB mode)
  ansible.builtin.command:
    cmd: >-
      timeout --preserve-status 360
      psql -v ON_ERROR_STOP=1
      -d {{ dhis2_db_name }}
      -c ANALYZE
  environment:
    PGOPTIONS: "-c lock_timeout=30000 -c statement_timeout=300000 -c maintenance_work_mem=512MB"
  delegate_to: "{{ _dhis2_restore_workhost }}"
  become: true
  become_user: postgres
  register: _dhis2_analyze_local
  changed_when: false
  failed_when: false
  when: not _dhis2_restore_remote

- name: Restore | ANALYZE database (best-effort, remote DB mode)
  ansible.builtin.command:
    cmd: >-
      timeout --preserve-status 360
      psql -v ON_ERROR_STOP=1
      -d {{ dhis2_db_name }}
      -c ANALYZE
  environment:
    PGHOST: "{{ dhis2_db_host }}"
    PGPORT: "{{ dhis2_db_port | string }}"
    PGUSER: "{{ dhis2_db_admin_user }}"
    PGPASSWORD: "{{ dhis2_db_admin_password }}"
    PGOPTIONS: "-c lock_timeout=30000 -c statement_timeout=300000 -c maintenance_work_mem=512MB"
  delegate_to: "{{ _dhis2_restore_workhost }}"
  become: false
  register: _dhis2_analyze_remote
  changed_when: false
  failed_when: false
  no_log: "{{ not (dhis2_debug | default(false) | bool) }}"
  when: _dhis2_restore_remote

- name: Restore | remove staged dump file
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ _dhis2_restore_staged }}"
    - "{{ _dhis2_restore_staged }}.psql.log"
  delegate_to: "{{ _dhis2_restore_workhost }}"
  become: "{{ not _dhis2_restore_remote }}"
