---
# Provision the DHIS2 PostgreSQL database.
#
# Two modes, switched by the `dhis2_db_remote` boolean rendered by
# create-instance.sh:
#
#   * dhis2_db_remote: false  (default)
#       PostgreSQL is installed inside the LXC and all DB-management tasks
#       run there as the local `postgres` unix user (legacy behaviour).
#
#   * dhis2_db_remote: true
#       PostgreSQL already runs on `dhis2_db_host`. The role skips the
#       install/systemd/tuning tasks and delegates the DB-management tasks
#       to the orchestrator (127.0.0.1), which connects to the remote host
#       as `dhis2_db_admin_user` over the network. Used when the operator
#       has filled in "Shared Postgres host" in Database Configurations.

# ---------------------------------------------------------------------------
# Local-install tasks (only when the DB lives inside this LXC).
# ---------------------------------------------------------------------------

# DHIS2 requires the database to be created with lc_collate/lc_ctype =
# en_US.UTF-8 (see "Create DHIS2 database" below). On a stock Ubuntu LXC
# only the C locale is generated, so postgresql-16's post-install initdb
# step creates the default cluster with locale=C — which then makes the
# CREATE DATABASE ... LC_COLLATE 'en_US.UTF-8' call fail with
# 'invalid LC_COLLATE locale name'. Generate the locale FIRST so the
# cluster init picks it up, and recreate the default cluster as a
# safety net if it was already initialised with the wrong locale.
- name: Ensure 'locales' package is installed
  ansible.builtin.apt:
    name: locales
    state: present
    update_cache: true
  when: not (dhis2_db_remote | default(false) | bool)

- name: Generate en_US.UTF-8 locale
  community.general.locale_gen:
    name: en_US.UTF-8
    state: present
  when: not (dhis2_db_remote | default(false) | bool)

- name: Install PostgreSQL packages
  ansible.builtin.apt:
    name:
      - "postgresql-{{ postgresql_version }}"
      - "postgresql-contrib-{{ postgresql_version }}"
      - "postgresql-{{ postgresql_version }}-postgis-3"
      - python3-psycopg2
    state: present
    update_cache: true
  when: not (dhis2_db_remote | default(false) | bool)

- name: Ensure PostgreSQL service is running
  ansible.builtin.systemd:
    name: postgresql
    state: started
    enabled: true
  when: not (dhis2_db_remote | default(false) | bool)

# Safety net: if the cluster was initialised before en_US.UTF-8 existed
# (e.g. on a partially-provisioned LXC from a previous run), drop the
# default cluster and recreate it with the correct locale. Only runs
# when no user databases have been created yet, so we never destroy data.
- name: Detect existing PostgreSQL cluster lc_collate
  ansible.builtin.command:
    cmd: psql -tAX -c "SHOW lc_collate;"
  become: true
  become_user: postgres
  register: pg_existing_lc_collate
  changed_when: false
  failed_when: false
  when: not (dhis2_db_remote | default(false) | bool)

- name: Count user databases in the existing cluster
  ansible.builtin.command:
    cmd: >-
      psql -tAX -c "SELECT count(*) FROM pg_database
      WHERE datname NOT IN ('postgres','template0','template1');"
  become: true
  become_user: postgres
  register: pg_user_db_count
  changed_when: false
  failed_when: false
  when:
    - not (dhis2_db_remote | default(false) | bool)
    - pg_existing_lc_collate.rc | default(1) == 0
    - (pg_existing_lc_collate.stdout | default('') | trim | lower) not in ['en_us.utf-8', 'en_us.utf8']

- name: Recreate PostgreSQL cluster with en_US.UTF-8 (locale mismatch on fresh install)
  when:
    - not (dhis2_db_remote | default(false) | bool)
    - pg_existing_lc_collate.rc | default(1) == 0
    - (pg_existing_lc_collate.stdout | default('') | trim | lower) not in ['en_us.utf-8', 'en_us.utf8']
    - (pg_user_db_count.stdout | default('999') | trim) == '0'
  block:
    - name: Stop PostgreSQL before dropping the default cluster
      ansible.builtin.systemd:
        name: postgresql
        state: stopped
    - name: Drop the default cluster
      ansible.builtin.command:
        cmd: "pg_dropcluster --stop {{ postgresql_version }} main"
    - name: Recreate the default cluster with en_US.UTF-8
      ansible.builtin.command:
        cmd: "pg_createcluster --locale en_US.UTF-8 {{ postgresql_version }} main"
    - name: Start PostgreSQL after recreating the cluster
      ansible.builtin.systemd:
        name: postgresql
        state: started

# ---------------------------------------------------------------------------
# Remote-mode preflight: confirm the orchestrator can reach the remote DB
# before we try to create roles/databases there.
# ---------------------------------------------------------------------------

- name: Verify orchestrator can reach the configured PostgreSQL host
  community.postgresql.postgresql_ping:
    login_host: "{{ dhis2_db_host }}"
    login_port: "{{ dhis2_db_port }}"
    login_user: "{{ dhis2_db_admin_user }}"
    login_password: "{{ dhis2_db_admin_password }}"
    db: postgres
  delegate_to: 127.0.0.1
  become: false
  when: dhis2_db_remote | default(false) | bool
  no_log: "{{ not (dhis2_debug | default(false) | bool) }}"

# ---------------------------------------------------------------------------
# DB-management tasks (apply in both modes; conditional become / delegate).
# ---------------------------------------------------------------------------

- name: Create DHIS2 database user
  community.postgresql.postgresql_user:
    name: "{{ dhis2_db_user }}"
    password: "{{ dhis2_db_password }}"
    state: present
    login_host: "{{ dhis2_db_host if (dhis2_db_remote | default(false) | bool) else omit }}"
    login_port: "{{ dhis2_db_port if (dhis2_db_remote | default(false) | bool) else omit }}"
    login_user: "{{ dhis2_db_admin_user if (dhis2_db_remote | default(false) | bool) else omit }}"
    login_password: "{{ dhis2_db_admin_password if (dhis2_db_remote | default(false) | bool) else omit }}"
  delegate_to: "{{ '127.0.0.1' if (dhis2_db_remote | default(false) | bool) else inventory_hostname }}"
  become: "{{ not (dhis2_db_remote | default(false) | bool) }}"
  become_user: "{{ omit if (dhis2_db_remote | default(false) | bool) else 'postgres' }}"
  no_log: "{{ not (dhis2_debug | default(false) | bool) }}"

- name: Ensure provisioning admin role exists
  community.postgresql.postgresql_user:
    name: "{{ dhis2_db_admin_user }}"
    password: "{{ dhis2_db_admin_password }}"
    state: present
    login_host: "{{ dhis2_db_host if (dhis2_db_remote | default(false) | bool) else omit }}"
    login_port: "{{ dhis2_db_port if (dhis2_db_remote | default(false) | bool) else omit }}"
    login_user: "{{ dhis2_db_admin_user if (dhis2_db_remote | default(false) | bool) else omit }}"
    login_password: "{{ dhis2_db_admin_password if (dhis2_db_remote | default(false) | bool) else omit }}"
  delegate_to: "{{ '127.0.0.1' if (dhis2_db_remote | default(false) | bool) else inventory_hostname }}"
  become: "{{ not (dhis2_db_remote | default(false) | bool) }}"
  become_user: "{{ omit if (dhis2_db_remote | default(false) | bool) else 'postgres' }}"
  no_log: "{{ not (dhis2_debug | default(false) | bool) }}"
  when:
    # In remote mode the admin role is assumed to already exist on the
    # shared host (and we are authenticating as it). Only auto-provision
    # the admin role in the local-install path, and only when it differs
    # from the app user.
    - not (dhis2_db_remote | default(false) | bool)
    - dhis2_db_admin_user is defined
    - dhis2_db_admin_user != dhis2_db_user

- name: Create DHIS2 database
  community.postgresql.postgresql_db:
    name: "{{ dhis2_db_name }}"
    owner: "{{ dhis2_db_user }}"
    encoding: UTF-8
    lc_collate: en_US.UTF-8
    lc_ctype: en_US.UTF-8
    template: template0
    state: present
    login_host: "{{ dhis2_db_host if (dhis2_db_remote | default(false) | bool) else omit }}"
    login_port: "{{ dhis2_db_port if (dhis2_db_remote | default(false) | bool) else omit }}"
    login_user: "{{ dhis2_db_admin_user if (dhis2_db_remote | default(false) | bool) else omit }}"
    login_password: "{{ dhis2_db_admin_password if (dhis2_db_remote | default(false) | bool) else omit }}"
  delegate_to: "{{ '127.0.0.1' if (dhis2_db_remote | default(false) | bool) else inventory_hostname }}"
  become: "{{ not (dhis2_db_remote | default(false) | bool) }}"
  become_user: "{{ omit if (dhis2_db_remote | default(false) | bool) else 'postgres' }}"
  when: not (dhis2_db_existing | default(false) | bool)

- name: Install required PostgreSQL extensions
  community.postgresql.postgresql_ext:
    name: "{{ item }}"
    db: "{{ dhis2_db_name }}"
    state: present
    login_host: "{{ dhis2_db_host if (dhis2_db_remote | default(false) | bool) else omit }}"
    login_port: "{{ dhis2_db_port if (dhis2_db_remote | default(false) | bool) else omit }}"
    login_user: "{{ dhis2_db_admin_user if (dhis2_db_remote | default(false) | bool) else omit }}"
    login_password: "{{ dhis2_db_admin_password if (dhis2_db_remote | default(false) | bool) else omit }}"
  loop: "{{ postgresql_extensions }}"
  delegate_to: "{{ '127.0.0.1' if (dhis2_db_remote | default(false) | bool) else inventory_hostname }}"
  become: "{{ not (dhis2_db_remote | default(false) | bool) }}"
  become_user: "{{ omit if (dhis2_db_remote | default(false) | bool) else 'postgres' }}"

- name: Grant database privileges to DHIS2 user
  community.postgresql.postgresql_privs:
    db: "{{ dhis2_db_name }}"
    roles: "{{ dhis2_db_user }}"
    type: database
    privs: ALL
    state: present
    login_host: "{{ dhis2_db_host if (dhis2_db_remote | default(false) | bool) else omit }}"
    login_port: "{{ dhis2_db_port if (dhis2_db_remote | default(false) | bool) else omit }}"
    login_user: "{{ dhis2_db_admin_user if (dhis2_db_remote | default(false) | bool) else omit }}"
    login_password: "{{ dhis2_db_admin_password if (dhis2_db_remote | default(false) | bool) else omit }}"
  delegate_to: "{{ '127.0.0.1' if (dhis2_db_remote | default(false) | bool) else inventory_hostname }}"
  become: "{{ not (dhis2_db_remote | default(false) | bool) }}"
  become_user: "{{ omit if (dhis2_db_remote | default(false) | bool) else 'postgres' }}"

- name: Restore database backup if requested
  ansible.builtin.include_tasks: restore.yml
  when: dhis2_restore is defined and dhis2_restore

# ---------------------------------------------------------------------------
# Local-install tuning (only relevant when PostgreSQL runs inside the LXC).
# ---------------------------------------------------------------------------

- name: Apply PostgreSQL tuning parameters
  ansible.builtin.lineinfile:
    path: "/etc/postgresql/{{ postgresql_version }}/main/postgresql.conf"
    regexp: "^#?\\s*{{ item.key }}\\s*="
    line: "{{ item.key }} = {{ item.value }}"
    state: present
  loop:
    - { key: "max_connections", value: "{{ postgresql_max_connections }}" }
    - { key: "shared_buffers", value: "{{ postgresql_shared_buffers }}" }
  notify: Restart PostgreSQL
  when: not (dhis2_db_remote | default(false) | bool)
