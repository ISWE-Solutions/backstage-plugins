---
# Restart the actual cluster instance (postgresql@<ver>-main). We shell
# out instead of using ansible.builtin.systemd because that module dumps
# the full unit-property block (~150 keys) per poll, which backs up the
# Backstage backend's spawn() stdout pipe and stalls ansible 10-20 min.
#
# We also issue the restart with `--no-block` so systemctl returns as
# soon as the job is queued. A blocking restart can hang for the entire
# WAL-replay window after a fresh restore (often 10-20 min) and even
# `timeout` cannot kill it cleanly because systemd holds the job. We
# bound liveness via the pg_isready wait below instead (up to ~5 min).
- name: Restart PostgreSQL
  listen: Restart PostgreSQL
  ansible.builtin.command:
    cmd: 'systemctl restart --no-block postgresql@{{ postgresql_version }}-main.service'
  changed_when: true

- name: Wait for PostgreSQL to accept connections after restart
  listen: Restart PostgreSQL
  ansible.builtin.command:
    cmd: pg_isready -q -h /var/run/postgresql -p 5432
  register: pg_isready_after_restart
  retries: 150
  delay: 2
  until: pg_isready_after_restart.rc == 0
  changed_when: false
  failed_when: false

- name: Dump recent PostgreSQL journal on restart failure
  listen: Restart PostgreSQL
  ansible.builtin.command:
    cmd: 'journalctl -u postgresql@{{ postgresql_version }}-main -n 100 --no-pager'
  register: pg_journal_on_failure
  changed_when: false
  failed_when: false
  when: pg_isready_after_restart is failed

- name: Show PostgreSQL journal on restart failure
  listen: Restart PostgreSQL
  ansible.builtin.debug:
    var: pg_journal_on_failure.stdout_lines
  when: pg_isready_after_restart is failed
