---
# Restart the actual cluster instance (postgresql@<ver>-main), not the
# oneshot meta unit. We deliberately shell out to `systemctl restart`
# wrapped in `timeout` rather than using ansible.builtin.systemd here:
# the systemd module returns the full unit-property dump (~150 keys,
# several KB) on every poll, and with this playbook streamed through
# the Backstage backend's spawn() pipe at -v that volume backs up the
# stdout pipe and silently stalls ansible-playbook for 10–20 min before
# it exits non-zero — even though the restart itself succeeded in ~1s.
# `command:` emits one short line and avoids the pipe-stall entirely.
- name: Restart PostgreSQL
  listen: Restart PostgreSQL
  ansible.builtin.command:
    cmd: "timeout 180 systemctl restart postgresql@{{ postgresql_version }}-main.service"
  changed_when: true

- name: Wait for PostgreSQL to accept connections after restart
  listen: Restart PostgreSQL
  ansible.builtin.command:
    cmd: pg_isready -q -h /var/run/postgresql -p 5432
  register: pg_isready_after_restart
  retries: 30
  delay: 2
  until: pg_isready_after_restart.rc == 0
  changed_when: false

- name: Dump recent PostgreSQL journal on restart failure
  listen: Restart PostgreSQL
  ansible.builtin.command:
    cmd: "journalctl -u postgresql@{{ postgresql_version }}-main -n 100 --no-pager"
  register: pg_journal_on_failure
  changed_when: false
  failed_when: false
  when: pg_isready_after_restart is failed

- name: Show PostgreSQL journal on restart failure
  listen: Restart PostgreSQL
  ansible.builtin.debug:
    var: pg_journal_on_failure.stdout_lines
  when: pg_isready_after_restart is failed
