---
- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"
  when: timezone is defined and timezone | length > 0

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - wget
      - unzip
      - gnupg
      - acl
    state: present

- name: Enable unattended security upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
  when: unattended_upgrades | default(true) | bool
