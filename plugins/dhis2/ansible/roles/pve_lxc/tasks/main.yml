---
# pve_lxc — create + start a Proxmox LXC container via the REST API.
#
# Runs on `localhost` (the Backstage / orchestrator host); never needs
# SSH access to a Proxmox node. All operations go through the API using
# the community.general.proxmox module with an API token.
#
# Required vars (passed via --extra-vars or vars.yml):
#   pve_api_host         — Proxmox API endpoint (host or host:8006)
#   pve_api_user         — e.g. root@pam
#   pve_api_token_id     — token id (the part after !)
#   pve_api_token_secret — token secret (UUID)
#   pve_node             — target Proxmox node name
#   pve_vmid             — VMID for the new container
#   pve_hostname         — container hostname
#   pve_root_password    — root password (emergency console use)
#   pve_ssh_pubkey       — public key string (single line) injected at create
#
# Optional vars (with defaults):
#   pve_cpu              — default 4
#   pve_memory           — default 8192 (MB)
#   pve_storage          — default 100 (GB)
#   pve_storage_pool     — default "local-lvm"
#   pve_bridge           — default "vmbr0"
#   pve_static_ip        — optional static IPv4 (from IPAM allocation); DHCP if unset
#   pve_static_prefix    — prefix length for pve_static_ip, default 24
#   pve_static_gateway   — gateway, required with pve_static_ip
#   pve_nameserver       — default "10.20.30.8" (internal dnsmasq)
#   pve_ostemplate       — default Ubuntu 22.04
#   pve_validate_certs   — default false (self-signed PVE certs are common)
#
# Sets the following facts for subsequent plays:
#   pve_container_ip     — IPv4 address of the new container
#   (and add_host registers `container` in groups [instances,databases])

- name: Validate required vars
  ansible.builtin.assert:
    that:
      - pve_api_host is defined and pve_api_host | length > 0
      - pve_api_user is defined and pve_api_user | length > 0
      - pve_api_token_id is defined and pve_api_token_id | length > 0
      - pve_api_token_secret is defined and pve_api_token_secret | length > 0
      - pve_node is defined and pve_node | length > 0
      - pve_vmid is defined
      - pve_hostname is defined and pve_hostname | length > 0
      - pve_root_password is defined and pve_root_password | length > 0
      - pve_ssh_pubkey is defined and pve_ssh_pubkey | length > 0
      - (pve_static_ip | default('') | length == 0) or (pve_static_gateway | default('') | length > 0)
    fail_msg: >-
      pve_lxc role is missing required variables. Check that the orchestrator
      is passing PVE API credentials (PROXMOX_API_*) and container specs.

- name: Create LXC container (idempotent)
  community.general.proxmox:
    api_host: '{{ pve_api_host }}'
    api_user: '{{ pve_api_user }}'
    api_token_id: '{{ pve_api_token_id }}'
    api_token_secret: '{{ pve_api_token_secret }}'
    validate_certs: '{{ pve_validate_certs | default(false) }}'
    node: '{{ pve_node }}'
    vmid: '{{ pve_vmid | int }}'
    hostname: '{{ pve_hostname }}'
    ostemplate: "{{ pve_ostemplate | default('local:vztmpl/ubuntu-24.04-standard_24.04-2_amd64.tar.zst') }}"
    cores: '{{ pve_cpu | default(4) | int }}'
    memory: '{{ pve_memory | default(8192) | int }}'
    disk: "{{ pve_storage_pool | default('local-lvm') }}:{{ pve_storage | default(100) | int }}"
    netif:
      # Static address allocated from IPAM when pve_static_ip is set (see
      # docs/infrastructure/ipam); DHCP otherwise.
      net0: >-
        name=eth0,bridge={{ pve_bridge | default('vmbr0') }},{{
        ('ip=' ~ pve_static_ip ~ '/' ~ (pve_static_prefix | default(24)) ~ ',gw=' ~ pve_static_gateway)
        if (pve_static_ip | default('') | length > 0) else 'ip=dhcp' }}
    # Internal resolver (dnsmasq on the DHCP LXC): resolves internal-only
    # example.org names and forwards the rest.
    nameserver: "{{ pve_nameserver | default('10.20.30.8') }}"
    features:
      - nesting=1
    unprivileged: true
    password: '{{ pve_root_password }}'
    pubkey: '{{ pve_ssh_pubkey }}'
    # Tag the container so Backstage can confidently identify which LXCs
    # in the cluster are DHIS2 instances managed by this plugin. The
    # dhis2-backend reconciler treats `dhis2` as the primary marker.
    # community.general.proxmox expects `tags` as a list of separate
    # strings (PVE itself stores them semicolon-delimited); passing a
    # joined string like "dhis2;backstage" fails validation with
    # "dhis2;backstage is not a valid tag".
    tags: "{{ pve_tags | default(['dhis2', 'backstage']) }}"
    state: present
    timeout: 300
  register: pve_create_result
  # Hide secrets (api_token_secret, root password, pubkey) by default.
  # Re-run with `-e dhis2_debug=true` (or DHIS2_DEBUG=1 via the wrapper)
  # to surface the real Proxmox API error on failure.
  no_log: '{{ not (dhis2_debug | default(false) | bool) }}'

- name: Start LXC container
  community.general.proxmox:
    api_host: '{{ pve_api_host }}'
    api_user: '{{ pve_api_user }}'
    api_token_id: '{{ pve_api_token_id }}'
    api_token_secret: '{{ pve_api_token_secret }}'
    validate_certs: '{{ pve_validate_certs | default(false) }}'
    node: '{{ pve_node }}'
    vmid: '{{ pve_vmid | int }}'
    hostname: '{{ pve_hostname }}'
    state: started
    timeout: 120
  no_log: '{{ not (dhis2_debug | default(false) | bool) }}'

# Some LXC templates ship without openssh-server (or with sshd masked),
# which makes the subsequent `Wait for SSH` step time out and breaks the
# whole bootstrap. Install + enable it directly via `pct exec` on the PVE
# node that owns the container, so we don't depend on SSH-into-container
# being already functional.
#
# The first hop is the API host (`pve_ssh_host`, the only PVE node we are
# guaranteed to reach from Backstage). When the container's owning node
# is the same host, `pct exec` runs locally. When it's a different node
# we re-SSH from the API host to the owning node and run `pct exec`
# there — that inner hop only works if cluster members have mutual root
# SSH (default Proxmox install, but some hardened deployments firewall
# port 22 between PVE nodes).
#
# This step is best-effort: most Proxmox-built standard templates
# (including ubuntu-24.04-standard) already ship sshd, in which case
# even a failure here is harmless because the next `Wait for SSH` step
# will succeed on its own. We therefore allow the task to fail without
# aborting the play — but we surface a clear warning so operators on
# templates that *do* lack sshd know to act.
- name: Ensure openssh-server is installed inside the LXC (via pct exec)
  vars:
    _pve_install_sshd_script: |
      set -e
      if ! command -v sshd >/dev/null 2>&1 && ! dpkg -s openssh-server >/dev/null 2>&1; then
        export DEBIAN_FRONTEND=noninteractive
        for i in 1 2 3 4 5; do
          apt-get update && apt-get install -y openssh-server && break
          sleep 5
        done
      fi
      systemctl unmask ssh 2>/dev/null || true
      systemctl enable --now ssh
    _pve_install_sshd_b64: '{{ _pve_install_sshd_script | b64encode }}'
    # If pve_ssh_host already names the owning node (single-node case or
    # API host happens to own the container) we skip the inner SSH hop.
    _pve_node_same_as_api: >-
      {{ (pve_ssh_host | default(pve_node, true)) in
         [pve_node, pve_node + '.' + (pve_domain | default('', true))] }}
  ansible.builtin.shell: |
    set -e
    SSH_OPTS="-o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=10"
    {% if _pve_node_same_as_api %}
    ssh $SSH_OPTS \
        {% if pve_ssh_port is defined %}-p {{ pve_ssh_port }}{% endif %} \
        {% if pve_ssh_key | default('', true) | length > 0 %}-i {{ pve_ssh_key }}{% endif %} \
        {{ pve_ssh_user | default('root') }}@{{ pve_ssh_host | default(pve_node) }} \
        "pct exec {{ pve_vmid | int }} -- bash -c 'echo {{ _pve_install_sshd_b64 }} | base64 -d | bash'"
    {% else %}
    ssh $SSH_OPTS \
        {% if pve_ssh_port is defined %}-p {{ pve_ssh_port }}{% endif %} \
        {% if pve_ssh_key | default('', true) | length > 0 %}-i {{ pve_ssh_key }}{% endif %} \
        {{ pve_ssh_user | default('root') }}@{{ pve_ssh_host | default(pve_node) }} \
        bash -s <<'OUTER_EOF'
    set -e
    ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=10 {{ pve_node }} \
        "pct exec {{ pve_vmid | int }} -- bash -c 'echo {{ _pve_install_sshd_b64 }} | base64 -d | bash'"
    OUTER_EOF
    {% endif %}
  args:
    executable: /bin/bash
  register: pve_lxc_sshd_install
  changed_when: "'Setting up openssh-server' in (pve_lxc_sshd_install.stdout | default(''))"
  failed_when: false
  no_log: '{{ not (dhis2_debug | default(false) | bool) }}'

- name: Warn if openssh-server pre-install failed (will rely on template default)
  ansible.builtin.debug:
    msg: >-
      Could not pre-install openssh-server via pct exec on '{{ pve_node }}'
      from '{{ pve_ssh_host | default(pve_node) }}' (rc={{ pve_lxc_sshd_install.rc | default('?') }}).
      Continuing — if the container's template already ships sshd this is
      harmless and the next 'Wait for SSH' step will succeed. If it
      doesn't, that step will time out and you'll need to switch to a
      template that includes openssh-server (e.g. the Proxmox-built
      ubuntu-24.04-standard) or open inter-node port 22 between PVE
      hosts. stderr was:
      {{ pve_lxc_sshd_install.stderr | default('(suppressed by no_log)') }}
  when: (pve_lxc_sshd_install.rc | default(0)) != 0

- name: Wait for container interfaces to come up
  ansible.builtin.uri:
    url: 'https://{{ pve_api_host }}/api2/json/nodes/{{ pve_node }}/lxc/{{ pve_vmid }}/interfaces'
    method: GET
    headers:
      Authorization: 'PVEAPIToken={{ pve_api_user }}!{{ pve_api_token_id }}={{ pve_api_token_secret }}'
    validate_certs: '{{ pve_validate_certs | default(false) }}'
    return_content: true
  register: pve_iface_resp
  until: >-
    pve_iface_resp.status == 200
    and (pve_iface_resp.json.data | default([])
         | selectattr('name', 'ne', 'lo')
         | selectattr('inet', 'defined')
         | map(attribute='inet')
         | reject('match', '^127\\.')
         | list | length > 0)
  retries: 60
  delay: 5
  no_log: '{{ not (dhis2_debug | default(false) | bool) }}'

- name: Extract container IPv4 address
  ansible.builtin.set_fact:
    pve_container_ip: >-
      {{
        (pve_iface_resp.json.data
         | selectattr('name', 'ne', 'lo')
         | selectattr('inet', 'defined')
         | map(attribute='inet')
         | reject('match', '^127\\.')
         | first
        ).split('/')[0]
      }}

- name: Show container IP
  ansible.builtin.debug:
    msg: 'Container {{ pve_vmid }} is up at {{ pve_container_ip }}'

- name: Wait for SSH on the new container
  ansible.builtin.wait_for:
    host: '{{ pve_container_ip }}'
    port: 22
    timeout: 180
    state: started

- name: Register container in runtime inventory
  ansible.builtin.add_host:
    name: '{{ instance_name | default(pve_hostname) }}'
    ansible_host: '{{ pve_container_ip }}'
    ansible_user: root
    ansible_ssh_private_key_file: "{{ ansible_ssh_private_key_file_orchestrator | default(lookup('env', 'ANSIBLE_SSH_KEY')) }}"
    # The orchestrator's venv interpreter (set on 127.0.0.1 in the
    # inventory + via the orchestrator env file) must NOT leak into
    # plays that target this freshly-created container — that path
    # doesn't exist inside the LXC. Pin the container interpreter to
    # its own /usr/bin/python3 here so subsequent plays use it.
    ansible_python_interpreter: /usr/bin/python3
    groups:
      - new_containers
    # Role + DHIS2 vars below let downstream plays target this host by name.
    database_host: '{{ instance_name | default(pve_hostname) }}'
    dhis2_version: "{{ dhis2_version | default('2.40') }}"
    fqdn: "{{ fqdn | default('') }}"
    proxy_rewrite: true
  changed_when: false
