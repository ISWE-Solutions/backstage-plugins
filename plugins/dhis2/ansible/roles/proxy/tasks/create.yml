---
# host_proxy/create.yml — write per-instance + base nginx config, request
# a Let's Encrypt certificate, validate and reload nginx.

# Make sure certbot (+ the nginx authenticator plugin) is installed on
# the PVE host. The task is a no-op once the packages are present, so
# it stays cheap on subsequent runs. We only install when certbot is
# actually going to be invoked.
#
# Proxmox hosts frequently run /var/cache/apt/archives close to full
# (we've seen 'You don't have enough free space in
# /var/cache/apt/archives/' for installs as small as 2 MB). Clean the
# apt cache first so the install has somewhere to download into. This
# is cheap and idempotent.
- name: Clean apt cache before installing certbot
  ansible.builtin.apt:
    autoclean: true
    clean: true
  when: not host_proxy_skip_certbot | bool

- name: Ensure certbot and the nginx plugin are installed
  ansible.builtin.package:
    name:
      - certbot
      - python3-certbot-nginx
    state: present
  when: not host_proxy_skip_certbot | bool

- name: Ensure nginx config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ host_proxy_upstream_dir }}"
    - "{{ host_proxy_sites_available }}"
    - "{{ host_proxy_sites_enabled }}"

# Webroot for certbot --webroot. Needs to exist before nginx tries to
# serve /.well-known/acme-challenge/ out of it.
- name: Ensure certbot webroot exists
  ansible.builtin.file:
    path: "{{ host_proxy_webroot }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: not host_proxy_skip_certbot | bool

# Detect whether the base-domain cert already exists. The base vhost
# template gates its 443 server{} block on this fact — if the cert is
# missing we render an HTTP-only bootstrap vhost first, run certbot via
# --webroot, then re-render with the SSL block enabled. This avoids the
# chicken-and-egg where certbot --nginx runs `nginx -t` before issuing
# the cert and fails on the very ssl_certificate path it's about to
# create.
- name: Check whether base-domain TLS cert already exists
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ host_proxy_base_domain }}/fullchain.pem"
  register: host_proxy_cert_stat

- name: Set cert_present fact (pre-certbot)
  ansible.builtin.set_fact:
    host_proxy_cert_present: "{{ host_proxy_cert_stat.stat.exists | bool }}"

# Path-based mode: per-instance file contains only a 'location /<inst>/'
# block; the base vhost terminates TLS and includes
# {{ host_proxy_upstream_dir }}/*.conf inside its 443 server{} block —
# but only once host_proxy_cert_present is true.
- name: Write per-instance location snippet (path-based)
  ansible.builtin.template:
    src: per_instance_path.conf.j2
    dest: "{{ host_proxy_upstream_file }}"
    owner: root
    group: root
    mode: "0644"
  when: host_proxy_routing_mode == 'path'
  notify: reload nginx

# Earlier revisions of this role named the base vhost
# "<base_domain>.conf" — which got swept up by the base vhost's own
# `include {{ host_proxy_upstream_dir }}/*.conf` (when both paths were
# pointed at /etc/nginx/conf.d) and by `include conf.d/*.conf`. The
# file is now stored without the .conf suffix, so remove any stale
# copy from the previous layout before writing the new one.
- name: Remove stale <base>.conf site file from previous layout
  ansible.builtin.file:
    path: "{{ host_proxy_site_file }}.conf"
    state: absent
  when: host_proxy_routing_mode == 'path'
  notify: reload nginx

- name: Remove stale <base>.conf sites-enabled symlink from previous layout
  ansible.builtin.file:
    path: "{{ host_proxy_site_link }}.conf"
    state: absent
  when: host_proxy_routing_mode == 'path'
  notify: reload nginx

- name: Write shared base vhost (path-based)
  ansible.builtin.template:
    src: base_path_vhost.conf.j2
    dest: "{{ host_proxy_site_file }}"
    owner: root
    group: root
    mode: "0644"
  when: host_proxy_routing_mode == 'path'
  notify: reload nginx

# Subdomain mode: one upstream + one vhost per instance, both already
# bundled into a single .conf under /etc/nginx/conf.d (back-compat).
- name: Write upstream file (subdomain)
  ansible.builtin.template:
    src: subdomain_upstream.conf.j2
    dest: "{{ host_proxy_upstream_file }}"
    owner: root
    group: root
    mode: "0644"
  when: host_proxy_routing_mode == 'subdomain'
  notify: reload nginx

- name: Write site file (subdomain)
  ansible.builtin.template:
    src: subdomain_vhost.conf.j2
    dest: "{{ host_proxy_site_file }}"
    owner: root
    group: root
    mode: "0644"
  when: host_proxy_routing_mode == 'subdomain'
  notify: reload nginx

# Only create the sites-enabled symlink when the two directories differ
# (classic Debian split). Path-based mode always hits this branch
# because the default switches to /etc/nginx/sites-{available,enabled};
# subdomain mode keeps both pointing at /etc/nginx/conf.d so we'd be
# symlinking a file onto itself.
- name: Enable site via sites-enabled symlink
  ansible.builtin.file:
    src: "{{ host_proxy_site_file }}"
    dest: "{{ host_proxy_site_link }}"
    state: link
    force: true
  when: host_proxy_sites_available != host_proxy_sites_enabled
  notify: reload nginx

# Request a TLS cert for the base FQDN. We use the --webroot
# authenticator so certbot doesn't have to `nginx -t` (and therefore
# doesn't trip over a not-yet-existent ssl_certificate path on the very
# first run). certbot certonly is idempotent — re-runs report
# 'cert not yet due for renewal' so we don't need a creates: guard at
# this layer; in path-based mode every sibling instance shares the same
# cert.
#
# Reload nginx first so the just-written bootstrap vhost (HTTP-only)
# is active and serving /.well-known/acme-challenge/ out of the webroot.
- name: Reload nginx so the bootstrap vhost serves ACME challenges
  ansible.builtin.command: "{{ host_proxy_nginx_reload_cmd }}"
  when:
    - not host_proxy_skip_certbot | bool
    - not host_proxy_cert_present | bool
  changed_when: true

- name: Request Let's Encrypt certificate
  ansible.builtin.command:
    cmd: >-
      {{ host_proxy_certbot_bin }} certonly --webroot
      -w {{ host_proxy_webroot | quote }}
      -d {{ host_proxy_base_domain | quote }}
      --non-interactive --agree-tos
      --email {{ host_proxy_email | quote }}
  register: host_proxy_certbot
  changed_when: "'Successfully received certificate' in host_proxy_certbot.stdout
                  or 'Renewing' in host_proxy_certbot.stdout"
  failed_when:
    - host_proxy_certbot.rc != 0
    - "'not yet due for renewal' not in host_proxy_certbot.stdout"
  when: not host_proxy_skip_certbot | bool
  notify: reload nginx

# Re-stat the cert after certbot ran and re-render the base vhost with
# the 443 server{} block enabled. The template is conditional on
# host_proxy_cert_present, so the second pass adds the SSL listener
# without breaking nginx on the first.
- name: Re-check base-domain TLS cert after certbot
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ host_proxy_base_domain }}/fullchain.pem"
  register: host_proxy_cert_stat_post
  when: not host_proxy_skip_certbot | bool

- name: Update cert_present fact (post-certbot)
  ansible.builtin.set_fact:
    host_proxy_cert_present: "{{ host_proxy_cert_stat_post.stat.exists | bool }}"
  when:
    - not host_proxy_skip_certbot | bool
    - host_proxy_cert_stat_post is defined

- name: Re-write shared base vhost with SSL enabled (path-based)
  ansible.builtin.template:
    src: base_path_vhost.conf.j2
    dest: "{{ host_proxy_site_file }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - host_proxy_routing_mode == 'path'
    - host_proxy_cert_present | bool
  notify: reload nginx

- name: Re-write site file with SSL enabled (subdomain)
  ansible.builtin.template:
    src: subdomain_vhost.conf.j2
    dest: "{{ host_proxy_site_file }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - host_proxy_routing_mode == 'subdomain'
    - host_proxy_cert_present | bool
  notify: reload nginx

# Validate the rendered config BEFORE the handler tries to reload nginx
# — a syntax error here is much easier to diagnose with the failing
# server_name / file path in the output than buried in journalctl after
# a failed reload.
- name: Validate nginx configuration
  ansible.builtin.command: "{{ host_proxy_nginx_validate_cmd }}"
  register: host_proxy_nginx_t
  changed_when: false

- name: Flush handlers so nginx reloads before this play exits
  ansible.builtin.meta: flush_handlers

- name: Report success
  ansible.builtin.debug:
    msg: >-
      central-host Nginx ready for
      {% if host_proxy_routing_mode == 'path' -%}
      https://{{ host_proxy_base_domain }}/{{ host_proxy_path_segment }}/
      {%- else -%}
      https://{{ host_proxy_base_domain }}
      {%- endif %}
       → {{ host_proxy_container_ip }}:8080
