---
# Defaults for the host_proxy role.
#
# This role replaces the legacy plugins/dhis2/scripts/configure-proxy.sh
# shell helper for the create / apply path. It runs on the Proxmox host
# (the central Nginx that terminates TLS) and writes either a path-based
# (<base>/<instance>) or subdomain (<instance>.<base>) reverse-proxy
# configuration for one DHIS2 LXC.

# Action: 'present' writes config + (optionally) requests a Let's Encrypt
# cert and reloads nginx. 'absent' removes the per-instance snippet (and
# the base vhost in subdomain mode) and reloads nginx. The orchestrator's
# rollback path passes host_proxy_state=absent.
host_proxy_state: present

# Routing inputs. host_proxy_domain may be either a bare FQDN
# (subdomain mode) or '<fqdn>/<instance>' (path-based mode, what the
# Backstage UI's Path-based routing produces).
host_proxy_vmid: ""
host_proxy_container_ip: ""
host_proxy_domain: ""
host_proxy_email: ""

# Optional override for the path segment / instance name. When unset,
# path-based mode parses it out of host_proxy_domain and subdomain mode
# falls back to the VMID.
host_proxy_instance_override: ""

# Layout. The defaults match the new UI hint (/etc/nginx/upstream).
host_proxy_upstream_dir: /etc/nginx/upstream
host_proxy_sites_available_path: /etc/nginx/sites-available
host_proxy_sites_enabled_path: /etc/nginx/sites-enabled
host_proxy_sites_available_subdomain: /etc/nginx/conf.d
host_proxy_sites_enabled_subdomain: /etc/nginx/conf.d

# When true, skip the certbot call (useful for dev / no public DNS).
host_proxy_skip_certbot: false

# Service / binary handles — overrideable for non-standard installs.
host_proxy_nginx_validate_cmd: nginx -t
host_proxy_nginx_reload_cmd: systemctl reload nginx
host_proxy_certbot_bin: certbot

# Webroot used by certbot's --webroot authenticator. We prefer --webroot
# over --nginx because --nginx runs `nginx -t` before issuing the cert,
# which fails the very first time we provision a new base domain (the
# vhost we just wrote references /etc/letsencrypt/live/<base>/fullchain.pem
# that certbot is about to create). Serving the ACME challenges out of
# this directory lets us issue the cert before the SSL server{} block is
# enabled.
host_proxy_webroot: /var/www/letsencrypt
