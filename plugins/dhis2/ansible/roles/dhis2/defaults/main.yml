---
java_version: 17
dhis2_home: /opt/dhis2/config
dhis2_install_dir: /opt/dhis2
dhis2_files_dir: /opt/dhis2/files
dhis2_war_url: "https://releases.dhis2.org/{{ dhis2_version }}/dhis.war"
# When set, this overrides dhis2_war_url and is fetched instead.
dhis2_war_file: ""

tomcat_user: tomcat
tomcat_group: tomcat
tomcat_install_dir: /opt/tomcat
tomcat_webapps_dir: "{{ tomcat_install_dir }}/webapps"
tomcat_defaults_file: /etc/default/tomcat
tomcat_service_name: tomcat
tomcat_java_opts: "-Djava.awt.headless=true -Xmx4G -Xms2G"

# ---------------------------------------------------------------------------
# Apache Tomcat is installed from the upstream archive at archive.apache.org
# (Ubuntu 24.04 dropped the `tomcat9` apt package). `tomcat_version` selects
# the major version — 9 for DHIS2 2.40/2.41 (javax), 10 for v42+ (jakarta).
# Override `tomcat_release` to pin a different patch level, or
# `tomcat_archive_url` to fetch from an internal mirror.
# ---------------------------------------------------------------------------
tomcat_version: "9"
tomcat_release_map:
  "9": "9.0.99"
  "10": "10.1.34"
tomcat_release: "{{ tomcat_release_map[tomcat_version | string] }}"
tomcat_archive_url: "https://archive.apache.org/dist/tomcat/tomcat-{{ tomcat_version | string }}/v{{ tomcat_release }}/bin/apache-tomcat-{{ tomcat_release }}.tar.gz"

# DB connection (database lives on the same host by default — see site.yml).
dhis2_db_host: localhost
dhis2_db_port: 5432

# Server base URL used in dhis.conf.
dhis2_server_base_url: "https://{{ fqdn }}"
