---
java_version: 17
dhis2_home: /opt/dhis2/config
dhis2_install_dir: /opt/dhis2
dhis2_files_dir: /opt/dhis2/files

# ---------------------------------------------------------------------------
# DHIS2 WAR download URL.
#
# Starting with v40 the upstream layout at releases.dhis2.org dropped the
# legacy "2.X/dhis.war" path and switched to:
#
#   https://releases.dhis2.org/{major}/dhis2-stable-{major}.{patch}.{hotfix}.war
#
# Example: dhis2_version=2.41.2 -> https://releases.dhis2.org/41/dhis2-stable-41.2.0.war
# Example: dhis2_version=41.2.0 -> https://releases.dhis2.org/41/dhis2-stable-41.2.0.war
# Example: dhis2_version=2.41.8.1 -> https://releases.dhis2.org/41/dhis2-stable-41.8.1.war
#
# Older releases (v38 and below) used "https://releases.dhis2.org/2.X/dhis.war"
# — set `dhis2_war_url` explicitly in extra-vars if you need to provision one
# of those.
# ---------------------------------------------------------------------------
_dhis2_version_clean: "{{ dhis2_version | regex_replace('^2\\.', '') }}"
_dhis2_version_parts: "{{ _dhis2_version_clean.split('.') }}"
_dhis2_major: '{{ _dhis2_version_parts[0] }}'
_dhis2_patch: "{{ (_dhis2_version_parts[1] | default('0')) }}"
_dhis2_hotfix: "{{ (_dhis2_version_parts[2] | default('0')) }}"
dhis2_war_url: 'https://releases.dhis2.org/{{ _dhis2_major }}/dhis2-stable-{{ _dhis2_major }}.{{ _dhis2_patch }}.{{ _dhis2_hotfix }}.war'
# When set, this overrides dhis2_war_url and is fetched instead.
dhis2_war_file: ''

tomcat_user: tomcat
tomcat_group: tomcat
tomcat_install_dir: /opt/tomcat
tomcat_webapps_dir: '{{ tomcat_install_dir }}/webapps'
tomcat_defaults_file: /etc/default/tomcat
tomcat_service_name: tomcat
dhis2_java_heap: '4G'
tomcat_java_opts: '-Djava.awt.headless=true -Dfile.encoding=UTF-8 -Xmx{{ dhis2_java_heap }} -Xms2G'

# ---------------------------------------------------------------------------
# Apache Tomcat is installed from the upstream archive at archive.apache.org
# (Ubuntu 24.04 dropped the `tomcat9` apt package). `tomcat_version` selects
# the major version — 9 for DHIS2 2.40/2.41 (javax), 10 for v42+ (jakarta).
# Override `tomcat_release` to pin a different patch level, or
# `tomcat_archive_url` to fetch from an internal mirror.
# ---------------------------------------------------------------------------
tomcat_version: '9'
# Pinned to the current Apache stable releases (refresh by re-checking
# https://archive.apache.org/dist/tomcat/tomcat-9/ and tomcat-10/).
tomcat_release_map:
  '9': '9.0.118'
  '10': '10.1.55'
tomcat_release: '{{ tomcat_release_map[tomcat_version | string] }}'
tomcat_archive_url: 'https://archive.apache.org/dist/tomcat/tomcat-{{ tomcat_version | string }}/v{{ tomcat_release }}/bin/apache-tomcat-{{ tomcat_release }}.tar.gz'

# DB connection (database lives on the same host by default — see site.yml).
dhis2_db_host: localhost
dhis2_db_port: 5432

# Server base URL used in dhis.conf.
dhis2_server_base_url: 'https://{{ fqdn }}'

# ---------------------------------------------------------------------------
# Tomcat context path for DHIS2.
#
# - Subdomain routing (e.g. fqdn="ento.dhis2.example.org")  → "" (root context).
#   WAR is deployed as ROOT.war and served at https://<fqdn>/.
# - Path-based routing (e.g. fqdn="dhis2.example.org/ento") → "ento".
#   WAR is deployed as ento.war and Tomcat serves it at /ento, so DHIS2's
#   in-app redirects (e.g. /dhis-web-login) are emitted with the /ento
#   prefix and survive the reverse proxy. nginx is configured to forward
#   /ento/* upstream unchanged (proxy_pass preserves the prefix).
#
# Computed from `fqdn`: anything after the first '/' becomes the segment.
# Override explicitly to force a specific context (or "" for root).
# ---------------------------------------------------------------------------
dhis2_context_path: >-
  {{ (fqdn.split('/', 1)[1] | trim('/'))
     if (fqdn is defined and '/' in fqdn)
     else '' }}
dhis2_war_name: >-
  {{ (dhis2_context_path ~ '.war')
     if (dhis2_context_path | length > 0)
     else 'ROOT.war' }}

# ---------------------------------------------------------------------------
# OpenTelemetry instrumentation (traces + JVM metrics, shipped to the
# SigNoz collector). Attached via the Java agent rather than any code
# change to DHIS2 itself — see /etc/default/tomcat on an instrumented
# instance for the resulting JAVA_OPTS/OTEL_* layout this produces.
# Set dhis2_otel_enabled: false in extra-vars to provision without it.
# ---------------------------------------------------------------------------
dhis2_otel_enabled: true
dhis2_otel_javaagent_version: '2.31.1'
dhis2_otel_javaagent_url: >-
  https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v{{ dhis2_otel_javaagent_version }}/opentelemetry-javaagent.jar
dhis2_otel_javaagent_path: /opt/otel/opentelemetry-javaagent.jar
dhis2_otel_exporter_endpoint: 'http://10.20.30.208:4317'
# Fraction of traces sampled (parentbased_traceidratio) — kept low by
# default since this runs across the whole fleet; bump per-instance via
# extra-vars for a busy instance you want denser trace coverage on.
dhis2_otel_traces_sampler_arg: '0.1'
dhis2_otel_service_name: 'dhis2-{{ instance_name | default(pve_hostname) }}'
