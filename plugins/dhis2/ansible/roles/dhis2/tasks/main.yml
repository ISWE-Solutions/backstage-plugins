---
# Flush any handlers notified by earlier roles (notably the postgres role's
# 'Restart PostgreSQL') BEFORE we install/start Tomcat. Otherwise that
# postgres restart fires only at end-of-play, by which time Tomcat is busy
# auto-deploying the 300 MB DHIS2 WAR — the resulting CPU/memory pressure in
# the LXC stalls `systemctl restart postgresql` for ~10 minutes and
# ansible-playbook bails with exit 2.
- name: Flush pending handlers (e.g. Restart PostgreSQL) before touching Tomcat
  ansible.builtin.meta: flush_handlers

- name: Install Java
  ansible.builtin.apt:
    name: "openjdk-{{ java_version }}-jdk-headless"
    state: present
    update_cache: true

# ---------------------------------------------------------------------------
# Apache Tomcat is installed from the upstream archive at
# archive.apache.org because Ubuntu 24.04 dropped the `tomcat9` apt package
# entirely. `tomcat_version` (9 or 10) selects the major version — see the
# role defaults for the archive URL / pinned release.
# ---------------------------------------------------------------------------
- name: Ensure Tomcat group exists
  ansible.builtin.group:
    name: "{{ tomcat_group }}"
    system: true
    state: present

- name: Ensure Tomcat user exists
  ansible.builtin.user:
    name: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    system: true
    home: "{{ tomcat_install_dir }}"
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Create Tomcat install directory
  ansible.builtin.file:
    path: "{{ tomcat_install_dir }}"
    state: directory
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    mode: "0750"

- name: Check whether Tomcat {{ tomcat_release }} is already installed
  ansible.builtin.stat:
    path: "{{ tomcat_install_dir }}/.installed-{{ tomcat_release }}"
  register: tomcat_installed_marker

- name: Download Apache Tomcat {{ tomcat_release }} archive
  ansible.builtin.get_url:
    url: "{{ tomcat_archive_url }}"
    dest: "/tmp/apache-tomcat-{{ tomcat_release }}.tar.gz"
    mode: "0644"
  when: not tomcat_installed_marker.stat.exists

- name: Extract Tomcat into the install directory
  ansible.builtin.unarchive:
    src: "/tmp/apache-tomcat-{{ tomcat_release }}.tar.gz"
    dest: "{{ tomcat_install_dir }}"
    remote_src: true
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    extra_opts:
      - --strip-components=1
  when: not tomcat_installed_marker.stat.exists

- name: Ensure Tomcat runtime directories are owned by the Tomcat user
  ansible.builtin.file:
    path: "{{ tomcat_install_dir }}/{{ item }}"
    state: directory
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    recurse: true
  loop:
    - bin
    - conf
    - lib
    - logs
    - temp
    - webapps
    - work

- name: Mark Tomcat installation as complete
  ansible.builtin.file:
    path: "{{ tomcat_install_dir }}/.installed-{{ tomcat_release }}"
    state: touch
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    mode: "0644"
  when: not tomcat_installed_marker.stat.exists

- name: Install Tomcat systemd unit
  ansible.builtin.template:
    src: tomcat.service.j2
    dest: "/etc/systemd/system/{{ tomcat_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  # No 'notify: Restart Tomcat' here — the 'Ensure Tomcat is enabled and
  # running' task later in this role explicitly starts Tomcat once, after
  # the WAR is in place and the defaults file is written. A handler-driven
  # restart at end of play would otherwise interrupt the WAR explosion.

- name: Create DHIS2 directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    mode: "0750"
  loop:
    - "{{ dhis2_install_dir }}"
    - "{{ dhis2_home }}"
    - "{{ dhis2_files_dir }}"

- name: Download DHIS2 WAR (from releases.dhis2.org)
  ansible.builtin.get_url:
    url: "{{ dhis2_war_url }}"
    dest: "{{ dhis2_install_dir }}/dhis.war"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    mode: "0640"
  when: dhis2_war_file | length == 0

- name: Copy DHIS2 WAR (from local override path)
  ansible.builtin.copy:
    src: "{{ dhis2_war_file }}"
    dest: "{{ dhis2_install_dir }}/dhis.war"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    mode: "0640"
    remote_src: "{{ dhis2_war_file is match('^/') }}"
  when: dhis2_war_file | length > 0

- name: Render dhis.conf
  ansible.builtin.template:
    src: dhis.conf.j2
    dest: "{{ dhis2_home }}/dhis.conf"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    mode: "0640"
  no_log: true

# ---------------------------------------------------------------------------
# Tomcat must be STOPPED before we touch /opt/tomcat/webapps. Otherwise the
# moment we overwrite ROOT.war the running Tomcat (autoDeploy=true,
# unpackWARs=true) starts exploding 300+ MB inside the LXC, thrashes the
# limited memory, and stalls every subsequent SSH/python task for ~10 min
# until ansible-playbook bails with a generic exit code 2.
# ---------------------------------------------------------------------------
- name: Reload systemd so the Tomcat unit is known
  ansible.builtin.systemd:
    daemon_reload: true

- name: Stop Tomcat before deploying the WAR
  ansible.builtin.systemd:
    name: "{{ tomcat_service_name }}"
    state: stopped
  register: tomcat_stop_result
  failed_when: false

- name: Remove default Tomcat webapps and any previously-exploded ROOT/context dirs
  # `ansible.builtin.file: state=absent` walks the entire directory tree and
  # serialises every path into the JSON diff payload (path_content.files +
  # path_content.directories). For a freshly-extracted Tomcat under -vvv that
  # produces several MB of stdout per loop item and inside a memory-constrained
  # LXC has been observed to silently stall the SSH/python worker for ~10
  # minutes before ansible-playbook bails with exit 2. A plain `rm -rf` is
  # constant-memory and finishes in <1 s for these directories.
  #
  # We also strip any *previous* WAR/exploded directory matching the same
  # context so that on re-runs (or when switching modes) Tomcat doesn't end
  # up serving the app under two contexts simultaneously.
  ansible.builtin.command:
    cmd: rm -rf
          "{{ tomcat_webapps_dir }}/ROOT"
          "{{ tomcat_webapps_dir }}/ROOT.war"
          "{{ tomcat_webapps_dir }}/docs"
          "{{ tomcat_webapps_dir }}/examples"
          "{{ tomcat_webapps_dir }}/host-manager"
          "{{ tomcat_webapps_dir }}/manager"
          {% if dhis2_context_path | length > 0 %}"{{ tomcat_webapps_dir }}/{{ dhis2_context_path }}" "{{ tomcat_webapps_dir }}/{{ dhis2_context_path }}.war"{% endif %}
  changed_when: true
  no_log: true

- name: Deploy DHIS2 WAR (context="/{{ dhis2_context_path | default('', true) }}" → {{ dhis2_war_name }})
  # We previously used `ansible.builtin.copy` with remote_src=true (reads
  # the full 300 MB into Python on the target to checksum), then tried
  # `cp -f` (still reads + writes 300 MB of data). Both have been observed
  # to silently stall the playbook for tens of minutes inside an LXC, with
  # no visible progress, before ansible-playbook bails with exit code 2.
  #
  # `{{ dhis2_install_dir }}` and `{{ tomcat_webapps_dir }}` are both
  # under /opt on the LXC rootfs, so a rename via `mv` is a single
  # filesystem metadata op — instantaneous and constant-memory regardless
  # of WAR size. The next task re-asserts owner/group/mode on the
  # destination, so we don't care about preservation. On re-runs the
  # `Download DHIS2 WAR` task above will re-fetch into
  # `{{ dhis2_install_dir }}/dhis.war` because we just moved it away.
  #
  # For path-based reverse proxying the WAR is deployed as
  # `<segment>.war` so Tomcat's servlet context becomes `/<segment>` and
  # in-app redirects (e.g. /<segment>/dhis-web-login) survive the proxy.
  ansible.builtin.command:
    cmd: mv -f "{{ dhis2_install_dir }}/dhis.war" "{{ tomcat_webapps_dir }}/{{ dhis2_war_name }}"
    removes: "{{ dhis2_install_dir }}/dhis.war"
  register: dhis2_root_war_copy
  changed_when: dhis2_root_war_copy.changed | default(true)

- name: Set ownership on deployed WAR
  ansible.builtin.file:
    path: "{{ tomcat_webapps_dir }}/{{ dhis2_war_name }}"
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    mode: "0640"

- name: Configure Tomcat defaults (JAVA_OPTS + DHIS2_HOME)
  ansible.builtin.copy:
    dest: "{{ tomcat_defaults_file }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by the dhis2 Ansible role — edits will be overwritten.
      JAVA_OPTS="{{ tomcat_java_opts }}"
      DHIS2_HOME={{ dhis2_home }}

- name: Ensure Tomcat is enabled and running
  ansible.builtin.systemd:
    name: "{{ tomcat_service_name }}"
    state: started
    enabled: true
    daemon_reload: true
