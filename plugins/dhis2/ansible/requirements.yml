---
# Ansible Galaxy requirements for the DHIS2 provisioning playbook.
#
# Install with:
#   ansible-galaxy collection install -r requirements.yml
#
# Python deps on the orchestrator (Backstage) host (install with pip):
#   - proxmoxer >= 2.0
#   - requests
#
# These power community.general.proxmox, which talks to the Proxmox REST
# API over HTTPS — no `pct`/`pvesh` CLI is required anywhere.

collections:
  - name: community.general
    version: ">=8.0.0"
  - name: ansible.posix
    version: ">=1.5.0"
