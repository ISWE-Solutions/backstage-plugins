---
# Wrapper playbook for the dhis2 Backstage plugin.
#
# End-to-end flow (no `pct`/`pvesh` CLI; LXC lifecycle is via REST API):
#   1. pve_lxc         — create + start the LXC via Proxmox REST API.
#                        Discovers IP, registers it as `new_containers`.
#   2. lxc_bootstrap   — SSH as root into the new container; install
#                        python3 + sudo; create the ansible user; drop the
#                        orchestrator pubkey; disable root SSH.
#   3. stage_restore   — copy controller-staged database dump into the
#                        container (only when dhis2_restore is set).
#   4. common/postgres/dhis2 — usual roles (run as the ansible user).
#
# TLS is handled at the Proxmox host by the central Nginx
# (see ../scripts/configure-proxy.sh) so this playbook does NOT
# install or configure any in-container web proxy.

- name: 'Phase 1 — create LXC via Proxmox API'
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: pve_lxc

- name: 'Phase 2 — bootstrap ansible user inside container (as root)'
  hosts: new_containers
  gather_facts: false
  vars:
    ansible_user: root
  roles:
    - role: lxc_bootstrap

- name: 'Phase 2b — re-register container under the ansible user'
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Add container to managed/instances groups as the ansible user
      ansible.builtin.add_host:
        name: '{{ instance_name | default(pve_hostname) }}'
        ansible_host: '{{ hostvars[instance_name | default(pve_hostname)].ansible_host }}'
        ansible_user: "{{ ansible_user_target | default('ansible') }}"
        ansible_ssh_private_key_file: '{{ hostvars[instance_name | default(pve_hostname)].ansible_ssh_private_key_file }}'
        ansible_become: true
        ansible_become_method: sudo
        groups:
          - instances
          - databases
        database_host: '{{ instance_name | default(pve_hostname) }}'
        dhis2_version: '{{ dhis2_version }}'
        fqdn: '{{ fqdn }}'
        proxy_rewrite: true

- name: 'Pre-flight — verify SSH reachability'
  hosts: instances
  gather_facts: false
  tasks:
    - name: Ping all managed hosts
      ansible.builtin.ping:

- name: 'Phase 3 — stage restore dump (if requested)'
  hosts: instances
  become: true
  gather_facts: false
  roles:
    - role: stage_restore

- name: 'Phase 4 — provision DHIS2 instance'
  hosts: instances
  become: true
  gather_facts: true
  roles:
    - role: common
    - role: postgres
    - role: dhis2

  post_tasks:
    # DHIS2 v40+ first-boot is slow: Tomcat unpacks the ~300 MB ROOT.war,
    # then DHIS2 runs all Flyway migrations and bootstraps the Hibernate
    # schema against the freshly-initialised database. On a cold LXC that
    # routinely takes 5–10 minutes, and on slower storage 10–15 minutes.
    # 90 × 10s = 15 minutes is a safer ceiling than the previous 10 min.
    #
    # The retry path is wrapped in a block/rescue so that if the endpoint
    # never comes up we capture the actual cause (Tomcat status, webapps
    # directory contents, last lines of catalina.out / dhis2 logs) in the
    # provision log before failing the play. Otherwise all we see is
    # "Status code was 404" with no context to diagnose.
    - name: Verify DHIS2 deployment
      block:
        # Poll the DHIS2 endpoint, but bail out fast if Tomcat logs a
        # "Context [/...] startup failed" / "SEVERE" deploy error in
        # catalina.out — those are unrecoverable and there's no point
        # waiting the full 15 minutes for an endpoint that will never come up.
        - name: Wait for DHIS2 web endpoint to respond (fail fast on Tomcat startup error)
          ansible.builtin.shell: |
            set -u
            ctx='{{ ("/" ~ dhis2_context_path) if (dhis2_context_path | default("", true) | length > 0) else "" }}'
            url="http://127.0.0.1:8080${ctx}/dhis-web-commons/security/login.action"
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url" || echo 000)
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then
              echo "HEALTHY $code"
              exit 0
            fi
            # Short-circuit on unrecoverable Tomcat startup failures.
            log=/opt/tomcat/logs/catalina.out
            if [ -f "$log" ] && grep -E -q \
              'Context \[[^]]*\] startup failed|One or more listeners failed to start|FATAL|ApplicationContext .* failed|BeanCreationException' \
              "$log"; then
              echo "FATAL Tomcat reported an unrecoverable startup failure (code=$code)"
              grep -E -n \
                'Context \[[^]]*\] startup failed|One or more listeners failed to start|FATAL|ApplicationContext .* failed|BeanCreationException|Caused by:' \
                "$log" | tail -n 20
              exit 2
            fi
            echo "PENDING $code"
            exit 1
          args:
            executable: /bin/bash
          register: dhis2_health
          retries: 90
          delay: 10
          # Retry while the script exits 1 (pending); succeed on exit 0;
          # break immediately on exit 2 (fatal Tomcat startup error) so we
          # surface the real cause instead of waiting 15 minutes.
          until: dhis2_health.rc == 0 or dhis2_health.rc == 2
          failed_when: dhis2_health.rc != 0
          changed_when: false
      rescue:
        - name: Diagnose — Tomcat service status
          ansible.builtin.command: systemctl status tomcat --no-pager -l
          register: _tomcat_status
          changed_when: false
          failed_when: false

        - name: Diagnose — webapps directory listing
          ansible.builtin.command: ls -la /opt/tomcat/webapps
          register: _webapps_ls
          changed_when: false
          failed_when: false

        - name: Diagnose — last 200 lines of catalina.out
          ansible.builtin.shell: |
            tail -n 200 /opt/tomcat/logs/catalina.out 2>/dev/null || true
            echo '--- catalina date-stamped logs ---'
            ls -1t /opt/tomcat/logs/catalina.*.log 2>/dev/null | head -1 \
              | xargs -r tail -n 200 2>/dev/null || true
          register: _catalina_tail
          changed_when: false
          failed_when: false

        - name: Diagnose — last 100 lines of localhost log
          ansible.builtin.shell: |
            ls -1t /opt/tomcat/logs/localhost.*.log 2>/dev/null | head -1 \
              | xargs -r tail -n 100 2>/dev/null || true
          register: _localhost_tail
          changed_when: false
          failed_when: false

        - name: Show Tomcat status
          ansible.builtin.debug:
            var: _tomcat_status.stdout_lines

        - name: Show webapps directory
          ansible.builtin.debug:
            var: _webapps_ls.stdout_lines

        - name: Show catalina.out tail
          ansible.builtin.debug:
            var: _catalina_tail.stdout_lines

        - name: Show localhost log tail
          ansible.builtin.debug:
            var: _localhost_tail.stdout_lines

        - name: Fail the play with the original DHIS2 endpoint error
          ansible.builtin.fail:
            msg: >-
              DHIS2 web endpoint did not become healthy
              (rc={{ dhis2_health.rc | default('?') }};
              {{ 'Tomcat reported an unrecoverable startup failure — see catalina.out tail above'
                 if (dhis2_health.rc | default(0)) == 2
                 else 'no 200/302 within 15 minutes' }}).
              See the diagnostic output above (Tomcat status, webapps
              listing, catalina.out tail, localhost log tail) for the
              underlying cause.

# ---------------------------------------------------------------------------
# Phase 5 — central Nginx reverse proxy on the Proxmox host
# ---------------------------------------------------------------------------
# Registers the PVE host dynamically (we already have SSH details from the
# orchestrator's pve_ssh_* extra-vars) and runs the host_proxy role to
# write the per-instance nginx config + base vhost + request a Let's
# Encrypt cert. This replaces the legacy
# plugins/dhis2/scripts/configure-proxy.sh call from
# create-instance.sh's Phase 3.

- name: 'Phase 5a — register Proxmox host for the central Nginx play'
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Add proxy host to pve_hosts group
      ansible.builtin.add_host:
        name: '{{ proxy_ssh_host | default(pve_ssh_host, true) }}'
        groups:
          - pve_hosts
        ansible_host: '{{ proxy_ssh_host | default(pve_ssh_host, true) }}'
        ansible_port: '{{ proxy_ssh_port | default(22) }}'
        ansible_user: >-
          {{ proxy_ssh_user
             | default(pve_ssh_user | default('root', true), true) }}
        ansible_ssh_private_key_file: >-
          {{ proxy_ssh_key
             | default(pve_ssh_key
                       | default(ansible_ssh_private_key_file_orchestrator,
                                 true),
                       true) }}
        ansible_python_interpreter: /usr/bin/python3
        # Carry the values the proxy role needs through as host vars
        # so the next play can target the group without referring back to
        # the orchestrator-side variables explicitly. host_proxy_upstream_dir
        # / host_proxy_nginx_reload_cmd are forwarded only when the
        # orchestrator actually rendered them (the role's defaults kick in
        # otherwise).
        host_proxy_vmid: '{{ pve_vmid }}'
        host_proxy_container_ip: >-
          {{ hostvars[instance_name | default(pve_hostname)].ansible_host }}
        host_proxy_domain: '{{ fqdn }}'
        host_proxy_email: "{{ email | default('') }}"
        host_proxy_skip_certbot: '{{ host_proxy_skip_certbot | default(false) }}'
        host_proxy_upstream_dir: >-
          {{ host_proxy_upstream_dir | default(omit, true) }}
        host_proxy_nginx_reload_cmd: >-
          {{ host_proxy_nginx_reload_cmd | default(omit, true) }}
      changed_when: false

- name: 'Phase 5b — write central Nginx config and request TLS cert'
  hosts: pve_hosts
  gather_facts: false
  become: true
  roles:
    - role: proxy
