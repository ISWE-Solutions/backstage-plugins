[defaults]
inventory             = inventory/hosts
roles_path            = roles
collections_path      = collections
host_key_checking     = False
retry_files_enabled   = False
stdout_callback       = yaml
bin_ansible_callbacks = True
forks                 = 10
timeout               = 60
gathering             = smart
fact_caching          = jsonfile
fact_caching_connection = .ansible-facts
fact_caching_timeout  = 3600
interpreter_python    = auto_silent

[ssh_connection]
pipelining            = True
ssh_args              = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o ConnectTimeout=15 -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no

[privilege_escalation]
become                = True
become_method         = sudo
become_user           = root
