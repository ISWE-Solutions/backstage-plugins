---
# Generated once on the controller (where the Backstage backend runs Ansible),
# stored under odoo_secrets_dir/<host>/ with mode 0600, reused on later runs
- name: Secrets directory on the controller
  ansible.builtin.file:
    path: '{{ odoo_secrets_dir }}/{{ inventory_hostname }}'
    state: directory
    mode: '0700'
  delegate_to: localhost
  become: false

- name: Master and database passwords
  ansible.builtin.set_fact:
    _odoo_admin_passwd: >-
      {{ odoo_admin_password | default('', true)
         or lookup('ansible.builtin.password', odoo_secrets_dir ~ '/' ~ inventory_hostname ~ '/admin_passwd',
                   length=32, chars=['ascii_letters', 'digits']) }}
    _odoo_db_password: >-
      {{ lookup('ansible.builtin.password', odoo_secrets_dir ~ '/' ~ inventory_hostname ~ '/db_password',
                length=32, chars=['ascii_letters', 'digits']) }}
  no_log: true

- name: Secret files are private
  ansible.builtin.file:
    path: '{{ odoo_secrets_dir }}/{{ inventory_hostname }}/{{ item }}'
    mode: '0600'
  loop: [admin_passwd, db_password]
  delegate_to: localhost
  become: false
