---
- name: Systemd unit
  ansible.builtin.template:
    src: odoo.service.j2
    dest: /etc/systemd/system/{{ odoo_service }}.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart Odoo

- name: Service enabled and running
  ansible.builtin.systemd_service:
    name: '{{ odoo_service }}'
    enabled: '{{ odoo_service_enabled | bool }}'
    state: "{{ (odoo_service_enabled | bool) | ternary('started', 'stopped') }}"
    daemon_reload: true
