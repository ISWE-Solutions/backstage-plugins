---
- name: Build and runtime packages
  ansible.builtin.apt:
    name:
      - git
      - python3-venv
      - python3-dev
      - python3-psycopg2 # for the postgresql modules below
      - build-essential
      - libpq-dev
      - libldap2-dev
      - libsasl2-dev
      - libxml2-dev
      - libxslt1-dev
      - libjpeg-dev
      - zlib1g-dev
      - libffi-dev
      - libssl-dev
      - fontconfig
      - xfonts-75dpi
      - xfonts-base
      - postgresql-client
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: PostgreSQL server (local database)
  ansible.builtin.apt:
    name: postgresql
    state: present
  when: odoo_install_postgresql | bool
