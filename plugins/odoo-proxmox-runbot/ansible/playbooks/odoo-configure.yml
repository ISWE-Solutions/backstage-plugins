---
# Rewrite odoo.conf and the service unit from the current variables; restart if they changed.
# Run from the ansible/ folder: ansible-playbook -i <inventory> playbooks/odoo-configure.yml [-l <instance>]
- name: Odoo configuration
  hosts: "{{ odoo_target | default('odoo') }}"
  gather_facts: false
  become: true
  tasks:
    - name: Connect to the guest
      ansible.builtin.import_role:
        name: odoo_guest
    - name: Configure
      ansible.builtin.import_role:
        name: odoo
        tasks_from: configure
