---
# Back up the database, filestore and odoo.conf (keeps odoo_backup_keep).
# Run from the ansible/ folder: ansible-playbook -i <inventory> playbooks/odoo-backup.yml [-l <instance>]
- name: Odoo backup
  hosts: "{{ odoo_target | default('odoo') }}"
  gather_facts: false
  become: true
  tasks:
    - name: Connect to the guest
      ansible.builtin.import_role:
        name: odoo_guest
    - name: Backup
      ansible.builtin.import_role:
        name: odoo
        tasks_from: backup
