---
# A template container per Odoo version for the runbot's proxmox executor.
# Inventory: one host per template (e.g. runbot-template-19), odoo_platform: proxmox,
# odoo_proxmox_vmid in the 9000-9999 template range, a temporary odoo_proxmox_ip,
# runbot_template_odoo_version and runbot_template_ssh_key.
# Run from the ansible/ folder: ansible-playbook -i <inventory> playbooks/runbot-template.yml -l <template>
- name: Runbot template
  hosts: "{{ runbot_target | default('runbot_templates') }}"
  gather_facts: false
  become: true
  roles:
    - role: odoo_guest
      vars:
        odoo_guest_create: true
    - role: runbot_template
  post_tasks:
    - name: Make it a template (stop, then convert)
      when: runbot_template_convert | bool
      delegate_to: localhost
      become: false
      vars:
        _api: https://{{ odoo_proxmox_api_host }}:{{ odoo_proxmox_api_port }}/api2/json/nodes/{{ odoo_proxmox_node }}/lxc/{{ odoo_proxmox_vmid }}
        _auth: PVEAPIToken={{ odoo_proxmox_api_user }}!{{ odoo_proxmox_api_token_id }}={{ odoo_proxmox_api_token_secret }}
      block:
        - name: Stop the container
          ansible.builtin.uri:
            url: '{{ _api }}/status/stop'
            method: POST
            headers: { Authorization: '{{ _auth }}' }
            validate_certs: '{{ odoo_proxmox_validate_certs }}'
          no_log: true

        - name: Wait until it is stopped
          ansible.builtin.uri:
            url: '{{ _api }}/status/current'
            headers: { Authorization: '{{ _auth }}' }
            validate_certs: '{{ odoo_proxmox_validate_certs }}'
          register: _runbot_tpl_status
          until: _runbot_tpl_status.json.data.status == 'stopped'
          retries: 30
          delay: 2
          no_log: true

        - name: Convert to a template
          ansible.builtin.uri:
            url: '{{ _api }}/template'
            method: POST
            headers: { Authorization: '{{ _auth }}' }
            validate_certs: '{{ odoo_proxmox_validate_certs }}'
          no_log: true
