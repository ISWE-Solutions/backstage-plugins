---
# nginx in front of the instance, with WebSocket and TLS
# (odoo_nginx_tls: certbot, provided or none).
# Run from the ansible/ folder: ansible-playbook -i <inventory> playbooks/nginx-proxy.yml [-l <instance>]
- name: Nginx for Odoo
  hosts: "{{ odoo_target | default('odoo') }}"
  gather_facts: false
  become: true
  roles:
    - role: odoo_guest
    - role: odoo_nginx
