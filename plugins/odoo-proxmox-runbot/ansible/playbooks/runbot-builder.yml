---
# A builder for the ISWE Runbot (the Backstage odoo-runbot backend): Docker,
# a local PostgreSQL for build databases, and the builder agent.
# Run from the ansible/ folder: ansible-playbook -i <inventory> playbooks/runbot-builder.yml -l <host>
- name: Runbot builder
  hosts: "{{ runbot_target | default('runbot_builders') }}"
  gather_facts: false
  become: true
  roles:
    - role: odoo_guest
      vars:
        odoo_guest_create: true
    - role: runbot_builder
