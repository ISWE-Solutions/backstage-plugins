---
# Create the guest (odoo_platform: proxmox, lxd, docker or ssh) and install Odoo in it.
# Run from the ansible/ folder: ansible-playbook -i <inventory> playbooks/odoo-install.yml [-l <instance>]
- name: Odoo instance
  hosts: "{{ odoo_target | default('odoo') }}"
  gather_facts: false
  become: true
  roles:
    - role: odoo_guest
      vars:
        odoo_guest_create: true
    - role: odoo
