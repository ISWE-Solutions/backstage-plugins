name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: yarn install --immutable
      - run: yarn tsc
      - run: yarn build:all
      - run: yarn lint:all
      - run: yarn prettier:check
      - run: yarn test
        env:
          CI: true
